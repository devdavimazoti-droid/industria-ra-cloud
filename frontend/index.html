<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>Centro Usinagem</title>
</head>
<body>
    <header id="hud">
        <div class="hud-text">
            <strong>
                Centro de Usinagem
            </strong>
            <span id="status">
                Iniciando o escaneamento...
            </span>
        </div>
        <span id="badge">
            Iniciando
        </span>
    </header>

    <!-- Camadas hotspot -->
    <div id="hotspot-layer">
        <button class="hotspot"
        type="button"
        data-topic="Usinagem"
        data-x="0.34"
        data-y="0.02"
        data-z="0.03"
        aria-label="Àrea de usinagem">
        1
        </button>

        <button class="hotspot"
        type="button"
        data-topic="Painel"
        data-x="0.07"
        data-y="0.03"
        data-z="0.03"
        aria-label="Painel">
        2
        </button>

        <button class="hotspot"
        type="button"
        data-topic="proteção"
        data-x="0.36"
        data-y="0.15"
        data-z="0.03"
        aria-label="Proteção">
        3
        </button>

        <button class="hotspot"
        type="button"
        data-topic="magazine"
        data-x="0.35"
        data-y="0.16"
        data-z="0.03"
        aria-label="Magazine">
        4
        </button>
    </div>

    <!-- Painel Informações -->
    <section
    id="info-panel"
    class="info-panel hidden"
    aria-live="polite">
        <button
        id="close-panel"
        class="close-button"
        type="button"
        aria-label="Fecha painel">
        x
        </button>
        <small>PONTO CENTRO DE USINAGEM</small>
        <h2 id="info-title">Componente</h2>
        <p id="info-text">Descrição.</p>
        <p id="info-detail" class="detail">Detalhe.</p>

        <!-- Botao de status vindo do backend -->
        <button id="status-button" class="status-button" type="button">
            Consultar status do equipamento
        </button>
        <p id="status-result"></p>
    </section>

    <!-- Cena MindAr -->
    <a-scene
        id="ar-scene"
        mindar-image="
        imageTargetSrc: assets/target/centro-usinagem.mind;
        autoStart: true;
        uiLoading: yes;
        uiScanning: yes;
        uiError: yes;
        "
        color-space="sRGB"
        renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
        alpha: true;
        "
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded>

        <!-- Câmera -->
        <a-camera
            id="ar-camera"
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- Target arquivo .mind -->
        <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">
        </a-entity>
    </a-scene>

    <!-- Js -->
    <script src="js/app.js"></script>
</body>
</html>

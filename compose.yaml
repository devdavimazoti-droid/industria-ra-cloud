services:
  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    environment:
      MQTT_BROKER: mqtt
    ports:
      - "5000:5000"
    depends_on:
      - mqtt
    restart: on-failure

  simulator:
    build: ./simulator
    environment:
      MQTT_BROKER: mqtt
    depends_on:
      - mqtt
    restart: on-failure

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro